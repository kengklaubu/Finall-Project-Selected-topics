services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -lc '
      for i in {1..30}; do
        python manage.py migrate --noinput && break;
        echo "DB not ready, retrying ($i/30)..."; sleep 2;
      done;
      python manage.py runserver 0.0.0.0:8000
      '
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-easyparking.settings}
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-easyparking}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started

volumes:
  db_data:
