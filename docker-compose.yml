version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --api.insecure=true     # (เปิด dashboard — ถ้าต้องการ)
    ports:
      - "80:80"
      # (ถ้าต้องการเปิด dashboard HTTP ก็อาจเปิด 8080)
      #"9090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
    networks:
      - webnet

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -lc '
      export SKIP_SCHEDULER=1;
      python manage.py collectstatic --noinput &&
      for i in {1..30}; do
        python manage.py migrate --noinput && break;
        echo "DB not ready, retrying ($i/30)..."; sleep 2;
      done;
      gunicorn easyparking.wsgi:application --bind 0.0.0.0:8000 --workers 3
      '
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-easyparking.settings}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet
    labels:
      - "traefik.enable=true"
      # กำหนด router ให้จับ path /s65114540079
      - "traefik.http.routers.easyparking.rule=Host(`10.80.21.9`) && PathPrefix(`/s65114540079`)"
      - "traefik.http.routers.easyparking.entrypoints=web"
      # middleware: strip prefix /s65114540079 ก่อนส่งไป Django
      - "traefik.http.routers.easyparking.middlewares=strip-s65114540079"
      - "traefik.http.middlewares.strip-s65114540079.stripprefix.prefixes=/s65114540079"
      # บอก port ที่ Django ใช้ภายใน
      - "traefik.http.services.easyparking.loadbalancer.server.port=8000"

      - "traefik.http.routers.easyparking.rule=Host(`10.80.21.9`) && (PathPrefix(`/s65114540079/static`) || PathPrefix(`/s65114540079/media`) || PathPrefix(`/s65114540079`))"
      - "traefik.http.routers.easyparking.middlewares=strip-s65114540079"

      # 👇 rule สำหรับ media โดยเฉพาะ
      - "traefik.http.routers.easypark-media.rule=PathPrefix(`/s65114540079/media`)"
  
  # ...


  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-easyparking}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - webnet

volumes:
  pg_data:

networks:
  webnet:
    driver: bridge
