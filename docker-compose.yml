services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -lc '
      export SKIP_SCHEDULER=1;
      python manage.py collectstatic --noinput &&
      for i in {1..30}; do
        python manage.py migrate --noinput && break;
        echo "DB not ready, retrying ($i/30)..."; sleep 2;
      done;
      gunicorn easyparking.wsgi:application --bind 0.0.0.0:8000 --workers 3
      '
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-easyparking.settings}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-easyparking}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
    # ถ้าอยากให้ต่อจากเครื่องโฮสต์ด้วยไคลเอนต์ ให้ปลดคอมเมนต์:
    # ports:
    #   - "5432:5432"

volumes:
  pg_data:
